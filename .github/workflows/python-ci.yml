name: "Sip&Savour API CI"

on:
  pull_request:
    branches: [ "**" ] # Syntaxe standard pour toutes les branches

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          # On s'assure d'installer les outils de sécurité que nous avons ajoutés
          pip install bcrypt argon2-cffi 

      - name: Run Tests
        # CRUCIAL : On utilise 'python -m pytest' pour charger le conftest.py
        # et on précise le dossier 'tests/' pour ignorer les fichiers .txt parasites
        run: |
          python -m pytest tests/ -v